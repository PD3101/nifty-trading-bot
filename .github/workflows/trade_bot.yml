name: nifty-trade-bot

# Runs the one-shot bot every 5 minutes during NSE market hours (IST).
# Times are UTC. IST = UTC + 5:30.
#   */5 4-9  -> 09:30-15:25 IST  (trading window; no trades before 09:45)
#   0 10     -> 15:30 IST        (market close / end-of-day exit)
on:
  schedule:
    - cron: '55 2 * * 1-5'   # 08:25 IST — pre-market bootstrap (chain takes over)
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'   # 15:30 IST — EOD force-close (chain also runs to 15:36)
    - cron: '5 10 * * 1-5'   # 15:35 IST — EOD force-close backup
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test Telegram message and stop'
        required: false
        default: false
        type: boolean
      scan_today:
        description: "Scan today's data and report signals (bypasses market hours)"
        required: false
        default: false
        type: boolean
      fetch_trades:
        description: 'Fetch today''s executed Kite trades and print them (trade book update)'
        required: false
        default: false
        type: boolean
      fetch_tradebook:
        description: 'Fetch FULL Kite console tradebook (historical, F&O) and print it'
        required: false
        default: false
        type: boolean
      log_premiums:
        description: 'Force real-option premium capture now (bypass trading-hours gate; for diagnostics/backfill)'
        required: false
        default: false
        type: boolean

# Never run two checks at once (protects bot_state.json from races).
concurrency:
  group: nifty-trade-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          python -m playwright install chromium --with-deps

      # Restore bot state (open position, error throttle) and the refreshed
      # Kite access token from the previous run. Persisting kite_credentials.json
      # avoids re-running the headless login on every single check.
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            bot_state.json
            kite_credentials.json
          key: nifty-state-latest
          restore-keys: |
            nifty-state-

      # Restore the accumulated real-option premium store (forward logger).
      - name: Restore premium store
        uses: actions/cache/restore@v4
        with:
          path: premiums.csv
          key: nifty-premiums-latest
          restore-keys: |
            nifty-premiums-

      - name: Run bot check
        run: |
          if [ "${{ github.event.inputs.fetch_tradebook }}" == "true" ]; then
            python fetch_tradebook.py
          elif [ "${{ github.event.inputs.fetch_trades }}" == "true" ]; then
            python fetch_today_trades.py
          else
            python github_actions_runner.py
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          KITE_CLIENT_ID: ${{ secrets.KITE_CLIENT_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
          GH_ACTION_TEST: ${{ github.event.inputs.test == 'true' }}
          SCAN_TODAY: ${{ github.event.inputs.scan_today == 'true' }}
          FORCE_PREMIUM_LOG: ${{ github.event.inputs.log_premiums == 'true' }}

      # Persist state for the next run (unique key each run; restore matches by prefix).
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot_state.json
            kite_credentials.json
          key: nifty-state-${{ github.run_id }}

      # Persist the accumulated premium store (forward logger) for future backtests.
      - name: Save premium store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: premiums.csv
          key: nifty-premiums-latest

      # Upload the store as an artifact so it can be inspected/downloaded.
      - name: Upload premium store artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premiums-store
          path: premiums.csv
          if-no-files-found: ignore
          retention-days: 90

      # Chain the next 5-minute scan via GitHub API, bypassing the unreliable
      # schedule cron. The schedule cron stays as a fallback bootstrap only.
      - name: Chain next scan
        if: always()
        run: python chain_next_run.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
