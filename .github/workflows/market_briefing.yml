name: nifty-market-briefing

# Sends the 09:00 IST pre-market briefing (news + international markets).
# 30 3 UTC = 09:00 IST, Mon-Fri.
on:
  schedule:
    - cron: '55 2 * * 1-5'   # 08:25 IST — early bootstrap (backup: 09:00 IST cron)
    - cron: '30 3 * * 1-5'   # 09:00 IST — primary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Send pre-market briefing
        run: python market_briefing.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
